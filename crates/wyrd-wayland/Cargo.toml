[package]
name = "wyrd-wayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Wayland wlr-layer-shell surfaces, shm buffer pools, seat input, and surface registry for Wyrd"

[dependencies]
anyhow = "1"
libc = "0.2"
log = "0.4"
serde_json = "1"
tiny-skia = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "fs", "io-util", "signal"] }
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wyrd-graphics = { workspace = true }
wyrd-state = { workspace = true }
xkbcommon = "0.9"
