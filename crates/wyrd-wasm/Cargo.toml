[package]
name = "wyrd-wasm"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Sandboxed WebAssembly module host and supervisor for Wyrd"

[dependencies]
anyhow = "1"
futures-util = { version = "0.3.34", default-features = false }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "fs", "io-util", "signal"] }
toml = "1"
wasmtime = "49.0.1"
wyrd-graphics = { workspace = true }
wyrd-state = { workspace = true }
zbus = "5"

[dev-dependencies]
wat = "1.0"
